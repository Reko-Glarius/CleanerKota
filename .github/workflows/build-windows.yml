name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - '*.spec'
      - 'requirements*.txt'
      - 'resource/**'
      - 'pattern.json'
      - 'tests/**'
      - 'build_exe.ps1'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test bot and interface
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable
        run: ./build_exe.ps1
      - name: Verify bundled executable
        run: |
          $executable = (Resolve-Path dist/CleanerKota.exe).Path
          $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'El ejecutable no terminó la verificación.'
          }
          if ($process.ExitCode -ne 0) { throw "Falló la verificación: $($process.ExitCode)" }
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanerKota-Windows
          path: dist/CleanerKota.exe
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $notes = "Build de Windows generado desde main. Commit: $env:GITHUB_SHA. Incluye las imágenes de referencia y el patrón predeterminado de 1920 x 1080."
          gh release create $tag dist/CleanerKota.exe --target $env:GITHUB_SHA --title "CleanerKota - Build $env:GITHUB_RUN_NUMBER" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
